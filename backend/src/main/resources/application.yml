    #       - browser_close

spring:
  config:
    import: optional:file:./config/application-local.yml,optional:file:./mcp-run.yml
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash

  datasource:
    url: jdbc:sqlite:./data/jingjing.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-sqlite.sql
  servlet:
    multipart:
      # 放宽上限以支持"上传整个文件夹"（单文件 20MB，整批请求 200MB）
      max-file-size: 20MB
      max-request-size: 200MB

# MyBatis 必须是顶层配置；放在 spring.mybatis 下不会被 starter 读取。
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.jingjingai2.entity
